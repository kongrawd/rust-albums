<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a">
        <animate attributeName="stop-color" values="#1e3a8a;#7c3aed;#1e3a8a" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#f97316;#0ea5e9" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- Spinning dashed ring -->
  <g transform="translate(320 180)">
    <circle r="120" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="24 18">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="86" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bouncing ball with its shadow -->
  <ellipse cx="320" cy="300" rx="34" ry="8" fill="#000" fill-opacity="0.25">
    <animate attributeName="rx" values="34;16;34" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="320" r="30" fill="url(#ball)">
    <animate attributeName="cy" values="268;120;268" keyTimes="0;0.5;1" keySplines="0.2 0.6 0.4 1;0.6 0 0.8 0.4" calcMode="spline" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting dot -->
  <circle r="10" fill="#22d3ee">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 440 180 A 120 120 0 1 1 200 180 A 120 120 0 1 1 440 180"/>
  </circle>

  <text x="320" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff">HEVC / H.265 sample</text>
  <text x="320" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.8">rust-albums · 4 s loop</text>
</svg>
